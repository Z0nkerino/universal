name: Desktop apps

# When package.json's version changes on main, this builds the Mac .dmg, the Windows
# installer and the self-update bundle, and publishes them as GitHub Release v<version>.
# Installed apps pick the release up automatically. "Run workflow" builds without publishing.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/universal-planner]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION has no release yet: building and publishing."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  update-bundle:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle -- "${{ github.event.head_commit.message }}"
      - uses: actions/upload-artifact@v4
        with:
          name: update-bundle
          path: |
            release/app-bundle.tar.gz
            release/latest.json

  mac:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          # No Apple Developer ID yet: the app is ad-hoc signed and not notarized.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist-desktop
        env:
          UP_DESKTOP: '1'
      - run: npx electron-builder --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, update-bundle, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Universal Planner ${{ needs.version.outputs.version }}" \
            --notes "Download the .dmg for Mac or the setup .exe for Windows. Installed apps update themselves."
