name: Desktop apps

# When package.json's version has no GitHub Release yet, this builds the Mac .dmg, the
# Windows installer and the self-update bundle, uploads them to a draft release, then
# publishes it. Installed apps pick the new release up automatically.
# Files go straight to the release (not Actions artifacts), so artifact storage quotas don't apply.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/universal-planner]

permissions:
  contents: write

# One release build at a time, so two quick pushes can't both publish the same version.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published; nothing to build."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            # Start from a clean draft (a failed earlier attempt may have left one behind).
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Universal Planner ${TAG#v}" \
              --notes "Download the .dmg for Mac or the setup .exe for Windows. Installed apps update themselves."
          fi

  update-bundle:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - run: gh release upload "${{ needs.version.outputs.tag }}" release/app-bundle.tar.gz release/latest.json --repo "$GITHUB_REPOSITORY" --clobber

  mac:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          # No Apple Developer ID yet: the app is ad-hoc signed and not notarized.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: gh release upload "${{ needs.version.outputs.tag }}" release/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist-desktop
        env:
          UP_DESKTOP: '1'
      - run: npx electron-builder --win nsis
      - run: gh release upload "${{ needs.version.outputs.tag }}" release/*.exe --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [version, update-bundle, mac, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
