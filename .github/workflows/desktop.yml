name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        env:
          # Without a Developer ID certificate the app is ad-hoc signed (not notarized).
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Planner-mac
          path: release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist-desktop
        env:
          UP_DESKTOP: '1'
      - run: npx electron-builder --win nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Universal-Planner-windows
          path: release/*.exe
