# Xcode project for the iOS app and its widget extension, generated by XcodeGen.
# Regenerate after pulling: `npm run ios:project` (or `xcodegen` here, then `pod install`).
name: App
options:
  bundleIdPrefix: com.eternalinc
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "10200"
    SWIFT_VERSION: "5.0"
    # Set your Apple team ID here (or in Xcode → Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
targets:
  App:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme App` works in CI.
    scheme: {}
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes:
          - public
          - Info.plist
          - App.entitlements
      # The web app, copied in by `npx cap copy ios`.
      - path: App/public
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eternalinc.universalplanner
        PRODUCT_NAME: App
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UniversalWidgets
        embed: true
  UniversalWidgets:
    type: app-extension
    platform: iOS
    # Interactive widgets (checking off tasks) and Live Activity buttons need iOS 17.
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - UniversalWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eternalinc.universalplanner.widgets
        PRODUCT_NAME: UniversalWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/UniversalWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
