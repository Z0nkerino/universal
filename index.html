<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Universal Planner</title>
    <meta name="description" content="Your calendar, tasks, notes, ideas and health — in one calm place. Private, offline, by Eternal Inc." />
    <meta name="author" content="Eternal Inc." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('up.theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // The last-used look (accent colors, font, background, glass) so the first frame already matches.
          var look = JSON.parse(localStorage.getItem('up.look') || 'null');
          if (look) {
            for (var k in look.vars) document.documentElement.style.setProperty(k, look.vars[k]);
            document.documentElement.dataset.bg = look.bg;
            document.documentElement.dataset.glass = look.glass;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #fff; }
      html.dark { background: #0a0a0a; }
      .up-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.01em; color: #0a0a0a; }
      html.dark .up-splash { color: #fff; }
      .up-splash img { border-radius: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app renders (React replaces it on first render). -->
      <div class="up-splash" aria-hidden="true">
        <img src="/favicon.svg" width="56" height="56" alt="" />
        <span>Universal Planner</span>
      </div>
    </div>
    <noscript>Universal Planner needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
